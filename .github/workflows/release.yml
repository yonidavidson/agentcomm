name: release

# Ships each GitHub Release to the npm registry — the one distribution
# channel. `npm publish` runs via npm trusted publishing (OIDC; no token
# secret), so the publish carries provenance linking it to this workflow run.
#
#   install / upgrade:  npm install -g @yonidavidson/agentcomm@latest
#   embed the SDK:      npm install @yonidavidson/agentcomm
#
# Releases carried `npm pack` tarballs as a registry-less fallback until
# 0.21.0 (issue #155). Three downloads in the six weeks after the registry
# became canonical, against a pack step, an upload step, `contents: write`,
# and an unattested second copy of every artifact — so the fallback went and
# the registry is the answer everywhere.
#
# No secrets: OIDC trusted publishing needs this repo+workflow configured as
# the trusted publisher for the package on npmjs.com (one-time setup).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no token secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 (node 22 bundles npm 10).
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Publish to the npm registry (skip if this version is already up)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@yonidavidson/agentcomm@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::agentcomm@${VERSION} already on the registry — skipping publish (workflow re-run?)"
            exit 0
          fi
          # prepublishOnly runs the build; provenance links the publish to this workflow run.
          npm publish --provenance
          echo "::notice::Published agentcomm@${VERSION} to the npm registry"
